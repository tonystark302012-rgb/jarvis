# ── MARK LV / JARVIS — project configuration ──────────────────────────────────
#
# One file for: what this project is, how it is linted, how it is type-checked,
# how it is tested, and how it can be built.
#
#   pip install .                      # installs the runtime requirements + modules
#   pip install -e ".[dev]"            # editable, with the test/lint stack
#   ruff check .                       # the gate that must stay green
#   python -m mypy                     # the curated module list below
#   python -m pytest tests/ -q         # what CI runs
#
# The app is meant to be RUN FROM ITS CHECKOUT (it resolves config/, plugins/,
# memory/ and its assets relative to the app root — see core/paths.py), which is
# what bootstrap.py sets up. The packaging metadata below exists so `pip install
# .` works, so tooling can see a real project instead of a folder, and so the
# dependency lists live in exactly one place. It is not a way to install this as
# a library into somebody else's environment.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-liv-jarvis"
description = "MARK LV (JARVIS) — a desktop voice assistant: PyQt6 HUD, phone dashboard, and a tool registry the model reaches through one router."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "Ankit Meena" }]
keywords = ["voice-assistant", "gemini-live", "pyqt6", "automation", "desktop"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The version lives in core/version.py and the dependency lists live in the two
# requirements files — read from there rather than copied here, so there is one
# place to change.
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.urls]
Source = "https://github.com/tonystark302012-rgb/jarvis"
Changelog = "https://github.com/tonystark302012-rgb/jarvis/blob/main/CHANGELOG.md"
Security = "https://github.com/tonystark302012-rgb/jarvis/blob/main/SECURITY.md"

[tool.setuptools]
# Explicit, not auto-discovered: the repository has several top-level packages
# AND top-level modules (`main`), which flat-layout discovery refuses to guess
# between. tools/ is shipped because the doctor and the maintenance scripts are
# genuinely useful against an install; tests/ is not.
packages = ["actions", "config", "core", "dashboard", "dots", "memory", "tools", "ui"]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.package-data]
dashboard = ["static/*"]
core = ["prompt.txt", "face_model.obj"]
# no ui entry: the HUD's styling is built as strings in ui/app.py, not shipped
# as .qss files. A pattern that matches nothing is a lie in the metadata.

[tool.setuptools.dynamic]
version = { attr = "core.version.__version__" }
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

# ── Lint ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"          # bootstrap.py hard floor; also silences the
line-length = 100                 # BaseExceptionGroup false positive (3.11+ builtin)

[tool.ruff.lint]
# E4/E7/E9 = import & statement errors + syntax; F = pyflakes (undefined names,
# unused imports/variables). This is the "does the code actually work" set.
select = ["E4", "E7", "E9", "F"]
# E701/E702 — the codebase's deliberate one-liner style (`if x: return y`).
# E402      — guarded imports after sys.path/flag setup are intentional.
# E741      — short names (l/I/O) in compact loops; renaming risks shadowing.
ignore = ["E701", "E702", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
# The dispatcher test extracts a slice of main.py with exec() on purpose —
# it must load the real production method without importing Qt.
"tests/*" = ["F401"]

# ── Types ─────────────────────────────────────────────────────────────────────
# The audit found thousands of mypy errors across the repository, nearly all of
# them "this parameter has no annotation" in code that is deliberately dynamic.
# Turning that on as a gate would mean either a mountain of `# type: ignore` or
# a red build nobody reads. So: a CURATED LIST of modules that are genuinely
# clean, checked as a hard gate. `python -m mypy` with no arguments checks
# exactly this list — 127 of the 160 modules in the app as of the P3-28 pass,
# up from 32 at the first commit.
#
# The list only ever grows, and a module earns its place: if it needs three
# suppressions to pass, it does not belong yet. What has not been reached is
# measured, not hidden: `python -m mypy --ignore-missing-imports core actions
# dashboard memory dots ui tools config main.py bootstrap.py` reports 374
# errors in 29 files today, and CI prints that number on every run.
[tool.mypy]
python_version = "3.11"
