ignore_missing_imports = true          # third-party stubs are not worth the tax
# Scope, not a suppression: mypy still follows imports for types, it just does
# not *report* on a module that is not on the list. Without this, one error in
# an unlisted module (dots/store.py, core/gemini.py) forces every listed module
# that imports it off the list, and the list can only ever shrink. Nothing is
# hidden by it: the warn-only CI job still runs mypy across the whole tree and
# prints the true error count, and a test in tests/test_project_hygiene.py
# asserts that job exists.
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_configs = true

# ── Tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
