name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} · lint + tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen   # no X server on runners — QImage/QPainter only
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Qt system libs (core.avatar imports PyQt6.QtGui → libGL et al)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Lint (ruff — pyflakes + statement errors)
        run: ruff check .

      - name: Syntax-check every module (catches what tests don't import)
        run: python -m compileall -q actions core dashboard memory ui config main.py ui.py setup.py

      - name: Tests
        run: python -m pytest tests/ -q
